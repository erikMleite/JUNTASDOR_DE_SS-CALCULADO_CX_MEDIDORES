<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>Juntador de SS</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Syne:wght@700;800&display=swap');

*,
*::before,
*::after{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#0f0f0f;
    --surface:#1a1a1a;
    --border:#2a2a2a;
    --accent:#f0c040;
    --text:#e8e8e8;
    --muted:#555;
    --success:#4ade80;
}

body{
    background:var(--bg);
    color:var(--text);
    font-family:'JetBrains Mono', monospace;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:2rem;
}

.card{
    width:100%;
    max-width:900px;
}

h1{
    font-family:'Syne', sans-serif;
    font-size:2rem;
    font-weight:800;
    color:var(--accent);
    margin-bottom:.25rem;
}

.subtitle{
    color:var(--muted);
    font-size:.8rem;
    margin-bottom:2rem;
}

label{
    display:block;
    font-size:.7rem;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:.1em;
    margin-bottom:.5rem;
}

textarea{
    width:100%;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:6px;
    color:var(--text);
    font-family:'JetBrains Mono', monospace;
    font-size:.85rem;
    padding:1rem;
    resize:vertical;
    min-height:120px;
    outline:none;
    line-height:1.6;
}

textarea:focus{
    border-color:var(--accent);
}

input,
select{
    width:100%;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:6px;
    color:var(--text);
    font-family:'JetBrains Mono', monospace;
    padding:14px;
    outline:none;
}

input:focus,
select:focus{
    border-color:var(--accent);
}

.separator-row{
    display:flex;
    gap:.5rem;
    margin:1rem 0;
    align-items:center;
    flex-wrap:wrap;
}

.sep-label{
    font-size:.7rem;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:.1em;
    min-width:80px;
}

.sep-options{
    display:flex;
    gap:.4rem;
    flex-wrap:wrap;
}

.sep-btn,
.base-btn,
.prefix-btn{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:4px;
    color:var(--text);
    font-family:'JetBrains Mono', monospace;
    font-size:.75rem;
    padding:.35rem .8rem;
    cursor:pointer;
    transition:.15s;
}

.sep-btn:hover,
.base-btn:hover,
.prefix-btn:hover{
    border-color:var(--accent);
    color:var(--accent);
}

.sep-btn.active,
.base-btn.active,
.prefix-btn.active{
    background:var(--accent);
    color:#000;
    border-color:var(--accent);
    font-weight:700;
}

.sep-custom{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:4px;
    color:var(--text);
    padding:.35rem .8rem;
    width:100px;
}
.btn-convert{
    width:100%;
    background:var(--accent);
    color:#000;
    border:none;
    border-radius:6px;
    padding:.9rem;
    font-weight:800;
    cursor:pointer;
    margin-top:1rem;
    margin-bottom:1rem;
}

.btn-convert:hover{
    opacity:.9;
}

.output-area{
    display:none;
}

.output-area.visible{
    display:block;
}

.output-box{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:6px;
    padding:1rem;
    min-height:120px;
    white-space:pre-wrap;
    line-height:1.6;
    color:var(--accent);
}

.equipe-container{
    margin-top:1rem;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:6px;
    padding:1rem;
}

.equipe-title{
    color:var(--muted);
    font-size:.75rem;
    margin-bottom:.75rem;
    text-transform:uppercase;
}

.equipe-grid{
    display:flex;
    flex-wrap:wrap;
    gap:.5rem;
}

.btn-copy,
.btn-clear{
    background:var(--border);
    color:white;
    border:none;
    border-radius:4px;
    padding:.5rem .8rem;
    cursor:pointer;
}

.btn-copy:hover{
    background:var(--accent);
    color:black;
}

.btn-clear:hover{
    background:#c0392b;
}

.output-footer{
    margin-top:.75rem;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.stats{
    color:var(--muted);
    font-size:.75rem;
}


/* ================================= */
/* NAVEGAÇÃO                        */
/* ================================= */

.nav-buttons{
    position:fixed;
    top:20px;
    right:20px;
    display:flex;
    gap:8px;
    z-index:1000;
}

.btn-nav{
    background:var(--accent);
    color:#000;
    border:none;
    border-radius:6px;
    padding:.75rem 1rem;
    font-family:'JetBrains Mono', monospace;
    font-size:.7rem;
    font-weight:800;
    cursor:pointer;
    transition:.15s;
    white-space:nowrap;
}

.btn-nav:hover{
    opacity:.85;
    transform:translateY(-1px);
}

.btn-voltar{
    background:var(--surface);
    color:var(--text);
    border:1px solid var(--border);
}

.btn-voltar:hover{
    border-color:var(--accent);
    color:var(--accent);
}


/* ================================= */
/* CALCULADORA                       */
/* ================================= */

.tela{
    display:none;
    width:100%;
}

.tela.ativa{
    display:block;
}

.calculadora-card{
    width:100%;
    max-width:800px;
    margin:auto;
}

.calculadora-card h1{
    margin-bottom:8px;
}

.calculadora-card .subtitle{
    margin-bottom:30px;
}

.calculadora-card label{
    margin-bottom:8px;
}

.campo-calculadora{
    margin-bottom:20px;
}

.btn-gerar-medidores{
    width:100%;
    border:none;
    background:var(--accent);
    color:#000;
    padding:16px;
    border-radius:6px;
    cursor:pointer;
    font-size:16px;
    font-family:'JetBrains Mono', monospace;
    font-weight:bold;
    margin-bottom:20px;
}

.btn-gerar-medidores:hover{
    opacity:.9;
}

.resultado-medidores{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:6px;
    min-height:250px;
    padding:15px;
    white-space:pre-wrap;
    color:var(--accent);
    margin-bottom:15px;
}

.botoes-medidores{
    display:flex;
    gap:10px;
}

.btn-medidor{
    flex:1;
    background:var(--border);
    border:none;
    color:white;
    padding:12px;
    border-radius:6px;
    cursor:pointer;
    font-family:'JetBrains Mono', monospace;
}

.btn-medidor:hover{
    background:var(--accent);
    color:black;
}

.info-medidores{
    margin-top:15px;
    color:var(--muted);
    font-size:12px;
}


/* ================================= */
/* CELULAR                           */
/* ================================= */

@media(max-width:700px){

    body{
        padding:1rem;
        align-items:flex-start;
    }

    .nav-buttons{
        position:relative;
        top:auto;
        right:auto;
        width:100%;
        justify-content:flex-end;
        margin-bottom:1.5rem;
        flex-wrap:wrap;
    }

    .btn-nav{
        font-size:.6rem;
        padding:.65rem .7rem;
    }

    .card{
        margin-top:0;
    }

}
/* ================================= */
/* ASSINATURA                        */
/* ================================= */

.copyright {
    position: fixed;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    color: #777;
    font-size: 12px;
    font-family: 'JetBrains Mono', monospace;
    text-align: center;
    z-index: 9999;
    opacity: 0.8;
}

/* ================================= */
/* ASSINATURA */
/* ================================= */
.copyright {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: #f0c040;
    font-size: 18px;
    font-family: 'JetBrains Mono', monospace;
    text-align: center;
    z-index: 9999;
    font-weight: bold;
}

    
    

</style>

</head>

<body>

<!-- ========================================= -->
<!-- BOTÕES DE NAVEGAÇÃO                      -->
<!-- ========================================= -->

<div class="nav-buttons">

    <button
        class="btn-nav"
        id="btn-calculadora"
        onclick="mostrarCalculadora()">

        CALCULADORA DE MEDIDORES

    </button>

    <button
        class="btn-nav btn-voltar"
        id="btn-voltar"
        onclick="voltarJuntador()">

        VOLTAR PÁGINA ANTERIOR

    </button>

</div>


<!-- ========================================= -->
<!-- TELA 1 - JUNTADOR DE SS                  -->
<!-- ========================================= -->

<div
    class="tela ativa"
    id="tela-juntador">

    <div class="card">

        <h1>
            Juntador de SS
        </h1>

        <p class="subtitle">
            Cole os números abaixo e gere a string com separador
        </p>

        <label>
            Números
        </label>

        <textarea
            id="input"
            placeholder="195167194 195301291 195314056">
        </textarea>

        <div class="separator-row">

            <span class="sep-label">
                Separador
            </span>

            <div class="sep-options">

                <button
                    class="sep-btn active"
                    onclick="setSep(' OR ', this)">

                    OR

                </button>

                <button
                    class="sep-btn"
                    onclick="setSep(' AND ', this)">

                    AND

                </button>

                <button
                    class="sep-btn"
                    onclick="setSep(', ', this)">

                    ,

                </button>

                <button
                    class="sep-btn"
                    onclick="setSep('\n', this)">

                    ↵

                </button>

            </div>

            <input
                class="sep-custom"
                id="custom-sep"
                placeholder="custom..."
                oninput="setCustomSep(this.value)">

        </div>


        <!-- BASE -->

        <div class="separator-row">

            <span class="sep-label">
                Base
            </span>

            <div class="sep-options">

                <button
                    class="base-btn"
                    onclick="setBase('EQUIPE K', this)">

                    EQUIPE K

                </button>

                <button
                    class="base-btn"
                    onclick="setBase('SEC. ITAPACI', this)">

                    SEC. ITAPACI

                </button>

                <button
                    class="base-btn"
                    onclick="setBase('SEC. MINAÇU', this)">

                    SEC. MINAÇU

                </button>

                <button
                    class="base-btn"
                    onclick="setBase('SEC. NOVA CRIXÁS', this)">

                    SEC. NOVA CRIXÁS

                </button>

                <button
                    class="base-btn"
                    onclick="setBase('SEC. PORANGATU', this)">

                    SEC. PORANGATU

                </button>

                <button
                    class="base-btn"
                    onclick="setBase('SEC. URUAÇU', this)">

                    SEC. URUAÇU

                </button>

            </div>

        </div>

        <!-- ================================= -->
        <!-- EQUIPES                           -->
        <!-- ================================= -->

        <div class="equipe-container">

            <div class="equipe-title">
                Equipes da Base Selecionada
            </div>

            <div
                class="equipe-grid"
                id="equipes-container">
            </div>

        </div>


        <!-- ================================= -->
        <!-- GERAR                             -->
        <!-- ================================= -->

        <button
            class="btn-convert"
            onclick="converter()">

            ▶ GERAR

        </button>


        <!-- ================================= -->
        <!-- RESULTADO                         -->
        <!-- ================================= -->

        <div
            class="output-area"
            id="output-area">

            <label>
                Resultado
            </label>

            <div
                class="output-box"
                id="output">
            </div>

            <div class="output-footer">

                <span
                    class="stats"
                    id="stats">
                </span>

                <div>

                    <button
                        class="btn-clear"
                        onclick="limpar()">

                        Limpar

                    </button>

                    <button
                        class="btn-copy"
                        id="btn-copy"
                        onclick="copiar()">

                        Copiar

                    </button>

                </div>

            </div>

        </div>

    </div>

</div>


<!-- ========================================= -->
<!-- TELA 2 - CALCULADORA DE MEDIDORES       -->
<!-- ========================================= -->

<div
    class="tela"
    id="tela-calculadora">

    <div class="calculadora-card">

        <h1>
            Cálculo de Medidores
        </h1>

        <p class="subtitle">
            Descobrir sequência de medidores com dígito verificador.
        </p>

        <div class="campo-calculadora">

            <label>
                Primeiro Medidor (sem dígito)
            </label>

            <input
                type="number"
                id="inicio"
                placeholder="14003656">

        </div>

        <div class="campo-calculadora">

            <label>
                Quantidade da Caixa
            </label>

            <select id="quantidade">

                <option value="8">
                    Caixa com 8
                </option>

                <option value="10">
                    Caixa com 10
                </option>

                <option value="12">
                    Caixa com 12
                </option>
                
                <option value="14">
                    Caixa com 14
                </option>

                <option value="18">
                    Caixa com 18
                </option>

            </select>

        </div>

        <button
            class="btn-gerar-medidores"
            onclick="gerarMedidores()">

            ▶ GERAR MEDIDORES

        </button>

        <div
            class="resultado-medidores"
            id="resultado-medidores">
        </div>

        <div class="botoes-medidores">

            <button
                class="btn-medidor"
                onclick="copiarMedidores()">

                Copiar

            </button>

            <button
                class="btn-medidor"
                onclick="limparMedidores()">

                Limpar

            </button>

        </div>

        <div
            class="info-medidores"
            id="estatistica">
        </div>

    </div>

</div>

<script>

/* ========================================= */
/* VARIÁVEIS DO JUNTADOR                    */
/* ========================================= */

let separador = ' OR ';

let prefixoAtivo = '';

let numerosGerados = [];

let baseAtiva = '';

let textoBase = '';


/* ========================================= */
/* BASES E EQUIPES                           */
/* ========================================= */

const equipesPorBase = {

    "EQUIPE K":{

        base:" ",

        equipes:[

            "ITPK292M",
            "MICK298M",
            "MROK296M",
            "NCSK294M",
            "NIQK290M",
            "PORK297M",
            "SMAK295M",
            "STEK293M",
            "URUK291M"

        ]

    },


    "SEC. ITAPACI":{

        base:"",

        equipes:[

            "CXAM230M",
            "CXAM231T",
            "CXAM233M",
            "ITPK292M",
            "ITPM217T",
            "ITPM218M",
            "ITPM218T",
            "RUBM279T",
            "RUBM281M",
            "SLNM242M",
            "SLNM243T",
            "STEK293M",
            "STEM226T",
            "STEM227M",
            "STEM227T",
            "14 OR 18 OR 19 OR 21 OR 39"

        ]

    },


    "SEC. MINAÇU":{

        base:" ",

        equipes:[

            "CDSM245M",
            "CDSM245T",
            "CPCM284M",
            "FOMM259M",
            "FOMM259T",
            "MICK298M",
            "MICM252M",
            "MICM252T",
            "MICM253M",
            "MICM255T",
            "TROM221M",
            "TROM222T",
            "TROM223M",
            "16 OR 25 OR 27 OR 28 OR 30 OR 43"

        ]

    },


    "SEC. NOVA CRIXÁS":{

        base:"",

        equipes:[

            "BONM265M",
            "BONM265T",
            "MUNM273T",
            "NCSK294M",
            "NCSM276T",
            "NCSM277M",
            "NPLM263M",
            "SMAK295M",
            "SMAM247M",
            "SMAM247T",
            "SMAM250T",
            "SMYM251M",
            "UIRM282M",
            "UIRM283T",
            "26 OR 33 OR 34 OR 36 OR 37 OR 42"

        ]

    },


    "SEC. PORANGATU":{

        base:" ",

        equipes:[

            "ENOM261M",
            "MROK296M",
            "MROM267T",
            "MROM268T",
            "MROM269M",
            "PORK297M",
            "PORM208M",
            "PORM209M",
            "PORM209T",
            "PORM210M",
            "PORM210T",
            "POYM214M",
            "STAM262M",
            "01 OR 29 OR 31 OR 32 OR 35"

        ]

    },


    "SEC. URUAÇU":{

        base:" ",

        equipes:[

            "CPNM224M",
            "NIQK290M",
            "NIQM235T",
            "NIQM236M",
            "NIQM236T",
            "NIQM237M",
            "NIQM237T",
            "NIYM241M",
            "URUK291M",
            "URUM202M",
            "URUM202T",
            "URUM203M",
            "URUM203T",
            "URYM207M",
            "11 OR 17 OR 20 OR 23 OR 24 OR 43 OR 48"

        ]

    }

};


/* ========================================= */
/* SEPARADOR                                */
/* ========================================= */

function setSep(sep, btn){

    separador = sep;

    document
        .querySelectorAll('.sep-btn')
        .forEach(botao => {

            botao.classList.remove('active');

        });

    btn.classList.add('active');

    document
        .getElementById('custom-sep')
        .value = '';

    renderOutput();

}


function setCustomSep(valor){

    if(valor){

        separador = valor;

        document
            .querySelectorAll('.sep-btn')
            .forEach(btn => {

                btn.classList.remove('active');

            });

    }

    renderOutput();

}


/* ========================================= */
/* SELECIONAR BASE                          */
/* ========================================= */

function setBase(nomeBase, btn){

    baseAtiva = nomeBase;

    textoBase =
        equipesPorBase[nomeBase].base;

    prefixoAtivo = '';

    document
        .querySelectorAll('.base-btn')
        .forEach(botao => {

            botao.classList.remove('active');

        });

    btn.classList.add('active');

    const container =
        document.getElementById(
            'equipes-container'
        );

    container.innerHTML = '';

    equipesPorBase[nomeBase]
        .equipes
        .forEach(equipe => {

            const botao =
                document.createElement('button');

            botao.className =
                'prefix-btn';

            botao.textContent =
                equipe;

            botao.onclick =
                function(){

                    setPrefix(
                        equipe,
                        botao
                    );

                };

            container.appendChild(botao);

        });

    renderOutput();

}


/* ========================================= */
/* SELECIONAR EQUIPE                        */
/* ========================================= */

function setPrefix(prefixo, btn){

    prefixoAtivo = prefixo;

    document
        .querySelectorAll(
            '#equipes-container .prefix-btn'
        )
        .forEach(botao => {

            botao.classList.remove('active');

        });

    btn.classList.add('active');

    renderOutput();

}
/* ========================================= */
/* MOSTRAR RESULTADO                        */
/* ========================================= */

function renderOutput(){

    if(numerosGerados.length === 0){
        return;
    }

    let resultado = '';

    if(textoBase){

        resultado += textoBase;

        resultado += '\n\n';

    }

    resultado +=
        numerosGerados.join(separador);

    if(prefixoAtivo){

        resultado +=
            ' PARA EQUIPE ';

        resultado +=
            prefixoAtivo;

    }

    document
        .getElementById('output')
        .textContent =
        resultado;

    document
        .getElementById('btn-copy')
        .textContent =
        'Copiar';

}


/* ========================================= */
/* GERAR                                    */
/* ========================================= */

function converter(){

    const raw =
        document
        .getElementById('input')
        .value;

    numerosGerados =
        raw
        .split(/[\s,;]+/)
        .map(item => item.trim())
        .filter(
            item => item.length > 0
        );

    if(numerosGerados.length === 0){

        alert(
            'Digite pelo menos um número.'
        );

        return;

    }

    document
        .getElementById('output-area')
        .classList
        .add('visible');

    document
        .getElementById('stats')
        .textContent =
        numerosGerados.length +
        ' itens';

    renderOutput();

}


/* ========================================= */
/* LIMPAR                                   */
/* ========================================= */

function limpar(){

    document
        .getElementById('input')
        .value = '';

    document
        .getElementById('output')
        .textContent = '';

    document
        .getElementById('output-area')
        .classList
        .remove('visible');

    document
        .getElementById('stats')
        .textContent = '';

    numerosGerados = [];

    prefixoAtivo = '';

    baseAtiva = '';

    textoBase = '';

    document
        .querySelectorAll('.base-btn')
        .forEach(btn => {

            btn.classList.remove('active');

        });

    document
        .getElementById('equipes-container')
        .innerHTML = '';

    document
        .getElementById('input')
        .focus();

}


/* ========================================= */
/* COPIAR                                   */
/* ========================================= */

function copiar(){

    const texto =
        document
        .getElementById('output')
        .textContent;

    if(!texto){
        return;
    }

    navigator.clipboard
        .writeText(texto);

    const btn =
        document.getElementById(
            'btn-copy'
        );

    btn.textContent =
        '✓ Copiado';

    setTimeout(() => {

        btn.textContent =
            'Copiar';

    }, 2000);

}


/* ========================================= */
/* CTRL + ENTER                             */
/* ========================================= */

document
    .getElementById('input')
    .addEventListener(
        'keydown',
        function(e){

            if(
                e.ctrlKey &&
                e.key === 'Enter'
            ){

                converter();

            }

        }
    );

/* ========================================= */
/* CALCULADORA DE MEDIDORES                 */
/* ========================================= */


/* ========================================= */
/* CÁLCULO DO DÍGITO                        */
/* ========================================= */

function calcularDigito(numero){

    const n =
        numero
        .toString()
        .padStart(8,'0');

    let soma = 0;

    soma += Number(n[7]) * 2;

    soma += Number(n[6]) * 3;

    soma += Number(n[5]) * 4;

    soma += Number(n[4]) * 5;

    soma += Number(n[3]) * 6;

    soma += Number(n[2]) * 7;

    soma += Number(n[1]) * 8;

    soma += Number(n[0]) * 9;

    let d =
        11 -
        (soma % 11);

    if(d === 10){
        return 0;
    }

    if(d === 11){
        return 1;
    }

    return d;

}


/* ========================================= */
/* GERAR MEDIDORES                          */
/* ========================================= */

function gerarMedidores(){

    const inicio =
        parseInt(
            document
            .getElementById('inicio')
            .value
        );

    if(
        isNaN(inicio)
    ){

        alert(
            'Informe o primeiro medidor.'
        );

        return;

    }

    const quantidade =
        parseInt(
            document
            .getElementById('quantidade')
            .value
        );

    let resultado = '';

    for(
        let i = 0;
        i < quantidade;
        i++
    ){

        const numero =
            inicio + i;

        const digito =
            calcularDigito(numero);

        resultado +=
            numero +
            '-' +
            digito +
            '\n';

    }

    document
        .getElementById(
            'resultado-medidores'
        )
        .textContent =
        resultado;

    document
        .getElementById(
            'estatistica'
        )
        .textContent =
        quantidade +
        ' medidores gerados';

}


/* ========================================= */
/* COPIAR MEDIDORES                         */
/* ========================================= */

function copiarMedidores(){

    const texto =
        document
        .getElementById(
            'resultado-medidores'
        )
        .textContent;

    if(!texto){

        alert(
            'Não há medidores para copiar.'
        );

        return;

    }

    navigator.clipboard
        .writeText(texto);

    alert(
        'Copiado!'
    );

}


/* ========================================= */
/* LIMPAR MEDIDORES                        */
/* ========================================= */

function limparMedidores(){

    document
        .getElementById('inicio')
        .value = '';

    document
        .getElementById(
            'resultado-medidores'
        )
        .textContent = '';

    document
        .getElementById(
            'estatistica'
        )
        .textContent = '';

    document
        .getElementById('inicio')
        .focus();

}

/* ========================================= */
/* MOSTRAR CALCULADORA                      */
/* ========================================= */

function mostrarCalculadora(){

    document
        .getElementById(
            'tela-juntador'
        )
        .classList
        .remove('ativa');

    document
        .getElementById(
            'tela-calculadora'
        )
        .classList
        .add('ativa');

    document
        .getElementById(
            'btn-calculadora'
        )
        .style
        .display = 'none';

    document
        .getElementById(
            'btn-voltar'
        )
        .style
        .display = 'block';

    window.scrollTo({
        top:0,
        behavior:'smooth'
    });

}


/* ========================================= */
/* VOLTAR PARA O JUNTADOR                   */
/* ========================================= */

function voltarJuntador(){

    document
        .getElementById(
            'tela-calculadora'
        )
        .classList
        .remove('ativa');

    document
        .getElementById(
            'tela-juntador'
        )
        .classList
        .add('ativa');

    document
        .getElementById(
            'btn-calculadora'
        )
        .style
        .display = 'block';

    document
        .getElementById(
            'btn-voltar'
        )
        .style
        .display = 'block';

    window.scrollTo({
        top:0,
        behavior:'smooth'
    });

}

document
    .getElementById(
        'btn-voltar'
    )
    .style
    .display = 'block';
