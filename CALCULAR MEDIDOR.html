<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cálculo de Medidores</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Syne:wght@700;800&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --bg:#0f0f0f;
    --surface:#1a1a1a;
    --border:#2a2a2a;
    --accent:#f0c040;
    --text:#e8e8e8;
    --muted:#666;
    --success:#4ade80;
}

body{
    background:var(--bg);
    color:var(--text);
    font-family:'JetBrains Mono', monospace;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
}

.card{
    width:100%;
    max-width:800px;
}

h1{
    color:var(--accent);
    font-family:'Syne', sans-serif;
    font-size:2rem;
    margin-bottom:8px;
}

.subtitle{
    color:var(--muted);
    margin-bottom:30px;
}

label{
    display:block;
    margin-bottom:8px;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:1px;
    color:var(--muted);
}

input,
select{

    width:100%;
    background:var(--surface);
    border:1px solid var(--border);
    color:var(--text);

    padding:14px;
    border-radius:6px;

    margin-bottom:20px;

    font-family:'JetBrains Mono', monospace;
}

input:focus,
select:focus{
    outline:none;
    border-color:var(--accent);
}

.btn-gerar{

    width:100%;

    border:none;

    background:var(--accent);

    color:#000;

    padding:16px;

    border-radius:6px;

    cursor:pointer;

    font-size:18px;

    font-weight:bold;

    margin-bottom:20px;
}

.btn-gerar:hover{
    opacity:.9;
}

.resultado{

    background:var(--surface);

    border:1px solid var(--border);

    border-radius:6px;

    min-height:250px;

    padding:15px;

    white-space:pre-wrap;

    color:var(--accent);

    margin-bottom:15px;
}

.botoes{
    display:flex;
    gap:10px;
}

.btn{

    flex:1;

    background:var(--border);

    border:none;

    color:white;

    padding:12px;

    border-radius:6px;

    cursor:pointer;
}

.btn:hover{
    background:var(--accent);
    color:black;
}

.info{

    margin-top:15px;

    color:var(--muted);

    font-size:12px;
}

</style>
</head>
<body>

<div class="card">

    <h1>Cálculo de Medidores</h1>

    <p class="subtitle">
        Descobrir sequência de medidores com dígito verificador.
    </p>

    <label>Primeiro Medidor (sem dígito)</label>

    <input
        type="number"
        id="inicio"
        placeholder="14003656">

    <label>Quantidade da Caixa</label>

    <select id="quantidade">

        <option value="8">Caixa com 8</option>

        <option value="10">Caixa com 10</option>

        <option value="12">Caixa com 12</option>

        <option value="18">Caixa com 18</option>

    </select>

    <button
        class="btn-gerar"
        onclick="gerar()">

        ▶ GERAR MEDIDORES

    </button>

    <div
        class="resultado"
        id="resultado">

    </div>

    <div class="botoes">

        <button
            class="btn"
            onclick="copiar()">

            Copiar

        </button>

        <button
            class="btn"
            onclick="limpar()">

            Limpar

        </button>

    </div>

    <div
        class="info"
        id="estatistica">

    </div>

</div>

<script>

function calcularDigito(numero){

    const n =
        numero.toString().padStart(8,'0');

    let soma = 0;

    soma += Number(n[7]) * 2;
    soma += Number(n[6]) * 3;
    soma += Number(n[5]) * 4;
    soma += Number(n[4]) * 5;
    soma += Number(n[3]) * 6;
    soma += Number(n[2]) * 7;
    soma += Number(n[1]) * 8;
    soma += Number(n[0]) * 9;

    let d =
        11 -
        (soma % 11);

    if(d === 10)
        return 0;

    if(d === 11)
        return 1;

    return d;
}

function gerar(){

    const inicio =
        parseInt(
            document
            .getElementById("inicio")
            .value
        );

    if(!inicio){

        alert(
            "Informe o primeiro medidor."
        );

        return;
    }

    const quantidade =
        parseInt(
            document
            .getElementById("quantidade")
            .value
        );

    let resultado = "";

    for(let i=0;i<quantidade;i++){

        const numero =
            inicio + i;

        const digito =
            calcularDigito(numero);

        resultado +=
            numero +
            "-" +
            digito +
            "\n";
    }

    document
        .getElementById("resultado")
        .textContent =
        resultado;

    document
        .getElementById("estatistica")
        .textContent =
        quantidade +
        " medidores gerados";
}

function copiar(){

    const texto =
        document
        .getElementById("resultado")
        .textContent;

    navigator.clipboard.writeText(texto);

    alert(
        "Copiado!"
    );
}

function limpar(){

    document
        .getElementById("inicio")
        .value = "";

    document
        .getElementById("resultado")
        .textContent = "";

    document
        .getElementById("estatistica")
        .textContent = "";
}

</script>

</body>
</html>
